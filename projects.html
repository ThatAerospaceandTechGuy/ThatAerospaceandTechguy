<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="All Projects - MyPortfolio">
    <title>MyPortfolio | Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="nav-container">
            <a href="index.html" class="logo">My<span>Portfolio</span></a>
            <button class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html" class="active">Projects</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero" style="text-align: center; padding: 3rem 1rem; margin-bottom: 2rem;">
            <h1 style="font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; line-height: 1.1; margin-bottom: 1rem; background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">All Projects</h1>
            <p class="subtitle" style="max-width: 600px; margin: 0 auto;">Complete showcase of my work and experiments</p>
            <div class="accent-line" aria-hidden="true" style="margin: 1.5rem auto 0;"></div>
        </section>

        <section id="all-projects" aria-labelledby="all-projects-title">
            <div class="projects-grid" id="allProjectsGrid" role="list">
                <div class="project-card" role="listitem" style="grid-column: 1/-1; text-align: center;">
                    <div class="project-content">
                        <div class="empty-state" style="padding: 2rem;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                <path d="M15.7 15.7l-6 6"/>
                            </svg>
                            <h3>Loading projects...</h3>
                            <p>Fetching all projects from GitHub.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="social-links">
                <a href="https://github.com" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.305-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
                </a>
                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                </a>
                <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                </a>
            </div>
            <p>&copy; 2026 MyPortfolio. Built with vanilla JS and deployed on Cloudflare Pages.</p>
        </div>
    </footer>

    <script>
        const mobileMenuBtn = document.querySelector('.mobile-menu-btn');
        const navLinks = document.getElementById('navLinks');

        mobileMenuBtn.addEventListener('click', () => {
            const isOpen = navLinks.classList.toggle('open');
            mobileMenuBtn.setAttribute('aria-expanded', isOpen);
        });

        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                navLinks.classList.remove('open');
                mobileMenuBtn.setAttribute('aria-expanded', 'false');
            });
        });

        async function loadAllProjects() {
            const grid = document.getElementById('allProjectsGrid');
            try {
                const response = await fetch('projects.json');
                
                if (!response.ok) {
                    if (response.status === 404) {
                        showEmptyState(grid, 'projects.json not found. Publish your first project from the Admin panel.');
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return;
                }

                const projects = await response.json();

                if (!Array.isArray(projects) || !projects.length) {
                    showEmptyState(grid, 'No projects published yet. Add your first project from the <a href="admin.html">Admin panel</a>.');
                    return;
                }

                grid.innerHTML = projects.map(project => `
                    <article class="project-card" role="listitem">
                        ${project.image ? `<img src="${escapeHtml(project.image)}" alt="" class="project-image">` : ''}
                        <div class="project-content">
                            <div class="project-meta">
                                <span class="project-date">Published on ${formatDate(project.date)}</span>
                                ${project.files && project.files.length ? `<span class="file-count" style="margin-left: 1rem; font-size: 0.8rem; color: var(--accent);">${project.files.length} file(s)</span>` : ''}
                            </div>
                            <h3 class="project-title">
                                <a href="project.html?slug=${encodeURIComponent(slugify(project.title))}">${escapeHtml(project.title)}</a>
                            </h3>
                            <p class="project-excerpt">${truncateHtml(project.content, 150)}</p>
                        </div>
                    </article>
                `).join('');
            } catch (error) {
                console.error('Error loading projects:', error);
                showEmptyState(grid, `Failed to load projects: ${escapeHtml(error.message)}`);
            }
        }

        function showEmptyState(grid, message) {
            grid.innerHTML = `
                <div class="project-card" role="listitem" style="grid-column: 1/-1;">
                    <div class="project-content">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                <path d="M15.7 15.7l-6 6"/>
                            </svg>
                            <h3>No projects found</h3>
                            <p>${message}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function truncateHtml(html, maxLength) {
            const div = document.createElement('div');
            div.innerHTML = html;
            const text = div.textContent || div.innerText || '';
            if (text.length <= maxLength) return html;
            return text.substring(0, maxLength).trim() + '...';
        }

        function slugify(text) {
            return text.toLowerCase()
                .trim()
                .replace(/[^\w\s-]/g, '')
                .replace(/[\s_-]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        loadAllProjects();
    </script>
</body>
</html>
